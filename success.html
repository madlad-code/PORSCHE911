<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        body {
            background-color: #0a0a0a;
            color: #f4f4f4;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            text-align: center;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 400;
            font-size: 2rem;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
        }
        p {
            font-weight: 300;
            font-size: 1rem;
            color: #888;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        a {
            color: #fff;
            text-decoration: none;
            border-bottom: 1px solid #333;
            transition: border-color 0.3s;
        }
        a:hover {
            border-bottom: 1px solid #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Vi har mottagit din förfrågan</h1>
